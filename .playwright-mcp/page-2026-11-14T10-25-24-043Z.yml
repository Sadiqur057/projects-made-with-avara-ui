        - generic [ref=f1e146]:
          - paragraph [ref=f1e147]: "Ember & Oak began in 2014 with a salvaged oak table, a hand-built hearth and a simple idea: fire is the oldest way to cook, and still the most honest. Chef Elias Moreau learned it in the farmhouse kitchens of his grandparents’ village, and brought it to a Brooklyn corner with a tiny menu and eleven seats."
          - paragraph [ref=f1e148]: Today the room seats forty-eight, but the rule has not changed. We burn only oak and cherrywood, buy from twelve farms within a hundred miles, and let the menu change when the weather does.
